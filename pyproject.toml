[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpscopilot"
version = "0.1.0"
description = "Risk- and confidence-calibrated cognitive LLM copilot for proactive CPS/IIoT security operations (research framework)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CPS Copilot research team" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "openpyxl>=3.1",  # reads the official SWaT .xlsx workbooks
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
torch = ["torch>=2.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "types-PyYAML"]

[project.scripts]
cpscopilot = "cpscopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: end-to-end tests that train models (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning:xgboost.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
# NPY002: seed_everything deliberately seeds NumPy's legacy global RNG (component code
#         uses explicit Generators). B905: every zip() pairs equal-length sequences.
ignore = ["NPY002", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
