name: tests

# Lint + full pytest suite (unit, leakage and end-to-end runs) on two dependency stacks.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: locked (py3.13, pandas 3)
            python: "3.13"
            install: pip install -r requirements-lock.txt
          - name: legacy stack (py3.11, pandas 2 / numpy 1)
            python: "3.11"
            install: >-
              pip install "pandas>=2.2,<3" "numpy>=1.26,<2.0" "scipy<1.15"
              "scikit-learn>=1.4,<1.6" "xgboost>=2.0,<2.2" "matplotlib>=3.8,<3.10"
              pyyaml "pydantic>=2.5,<2.10" "openpyxl>=3.1,<3.2" pytest ruff anthropic
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}

      - name: Lint
        run: ruff check src tests scripts

      - name: Tests
        run: python -m pytest -q
