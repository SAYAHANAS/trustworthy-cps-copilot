# TON_IoT (UNSW Canberra) network dataset: the full processed files
# Processed_datasets/Processed_Network_dataset/Network_dataset_1.csv ... _23.csv
# (22.3 M flow records, 3.4 GB). The Train_Test sample train_test_network.csv has no
# time column and cannot be used here. Files are read in numeric order (2 before 10)
# with only the columns below; flows are shifted to the time they become observable
# (connection end) and aggregated into right-closed 10 s bins (sum/mean/max of
# numeric fields, event counts and distinct counts of hosts/ports/services). Gaps
# longer than max_gap_factor bins are outages: dropped, a new segment starts.
# Data caveats for the paper: the capture is not contiguous (about 6.5 days of
# traffic over 2-29 Apr 2019), about 96% of flows are attacks, and each attack type
# occurs in one time window, so a chronological split tests unseen attack types.
# Start with a few files to gauge memory (--set "dataset.paths=[...]").
extends: ../default.yaml
name: ton-iot-network
description: TON_IoT network flows aggregated to 10 s windows.

dataset:
  name: ton_iot
  paths: [data/raw/TON_IoT/network/Network_dataset_*.csv]
  timestamp_col: ts
  timestamp_unit: s
  event_duration_col: duration   # bin each flow at ts + duration (when it is observable)
  record_kind: event             # an empty bin means "no traffic", not a lost poll
  label_col: label
  positive_labels: [1]
  attack_type_col: type
  feature_include: [duration, src_bytes, dst_bytes, missed_bytes, src_pkts, src_ip_bytes,
                    dst_pkts, dst_ip_bytes, dns_qclass, dns_qtype, dns_rcode,
                    http_request_body_len, http_response_body_len, http_status_code]
  count_distinct_cols: [src_ip, dst_ip, dst_port, proto, service, conn_state]
  resample_seconds: 10
  resample_aggs: [sum, mean, max]
  max_gap_factor: 60

split:
  min_positive_rows: 30

trust:
  default_criticality: 0.6
  asset_rules:
    - {pattern: "^(src|dst)_", asset: iot_network_hosts, criticality: 0.7,
       description: "IoT/IIoT hosts exchanging traffic on the monitored network"}
    - {pattern: "^(dns|http)_", asset: network_services, criticality: 0.6,
       description: "DNS and HTTP services used by IoT gateways"}
    - {pattern: "^event_count", asset: iot_network_hosts, criticality: 0.7,
       description: "IoT/IIoT hosts exchanging traffic on the monitored network"}
