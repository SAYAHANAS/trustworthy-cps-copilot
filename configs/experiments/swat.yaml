# SWaT (Secure Water Treatment, iTrust/SUTD), attack-period export (A1 Dec 2015).
# Request access from iTrust and export SWaT_Dataset_Attack_v0 to CSV. The file is
# only read (and SHA-256 fingerprinted); it is never modified.
#
# The attack-period file is used for the supervised chronological split because
# the normal-period file contains no attacks. Check `cpscopilot audit` first: every
# split must contain attacks (min_positive_rows) - adjust fractions or switch to
# strategy: timestamp with explicit train_end / calibration_end if needed.
extends: ../default.yaml
name: swat
description: SWaT attack period, 10 s causal bins, 5/15/30-minute horizons.

dataset:
  name: swat
  paths: [data/raw/SWaT/SWaT_Dataset_Attack_v0.csv]
  timestamp_col: Timestamp
  label_col: Normal/Attack
  positive_labels: [Attack, A ttack]
  dayfirst: true
  resample_seconds: 10
  resample_aggs: [mean]

split:
  strategy: fraction
  train_frac: 0.6
  calibration_frac: 0.2
  test_frac: 0.2
  min_positive_rows: 30

features:
  windows: [6, 30, 90]
  stats: [mean, std, min, max, slope]

trust:
  # SWaT tags carry the stage in their first digit (FIT101 -> P1, AIT202 -> P2, ...);
  # the default asset_rules already encode stages P1-P6.
  default_criticality: 0.5
