# Fast end-to-end check (well under a minute on a laptop CPU). The test suite runs an
# even smaller variant of it. Too few campaigns make the horizon models memorise
# campaign context instead of attack mechanics; use synthetic_full for results.
extends: ../default.yaml
name: synthetic-smoke
description: Small synthetic plant, small ensembles, few bootstrap resamples.

dataset:
  synthetic:
    days: 3.0
    n_attacks: 28

detection:
  ensemble_size: 3
  params: {n_estimators: 60, max_depth: 4, learning_rate: 0.1, subsample: 0.8,
           colsample_bytree: 0.8, min_child_weight: 1.0, reg_lambda: 1.0}

prediction:
  ensemble_size: 3
  params: {n_estimators: 60, max_depth: 4, learning_rate: 0.1, subsample: 0.8,
           colsample_bytree: 0.8, min_child_weight: 1.0, reg_lambda: 1.0}

copilot:
  max_events: 20

evaluation:
  bootstrap_resamples: 40

runtime:
  n_jobs: 2
  leakage_probes: 6
